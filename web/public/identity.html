<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Notes — working name</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%235049a6%27/%3E%3Cpath d=%27M7 14v4m4-8v12m5-17v22m5-17v12m4-8v4%27 stroke=%27white%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #24243a; background: #f5f2eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
    main { max-width: 480px; width: 100%; }
    .mark { width: 44px; height: 44px; padding: 9px; color: white; background: #5049a6; border-radius: 12px; }
    .label { margin: 30px 0 10px; color: #686274; font-size: 13px; }
    h1 { margin: 0; font-size: clamp(36px, 8vw, 48px); letter-spacing: -.04em; font-weight: 600; }
    p { max-width: 390px; font-size: 17px; line-height: 1.6; color: #686274; }
    a { display: inline-block; margin-top: 18px; border-radius: 9px; padding: 13px 18px; background: #5049a6; color: white; font-size: 14px; font-weight: 600; text-decoration: none; }
    a:hover { background: #443e90; }
    a:focus-visible { outline: 3px solid #5049a6; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 14v4m5-8v12m6-17v22m6-17v12m5-8v4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <p class="label">Working name</p>
    <h1>Voice Notes</h1>
    <p>Dictation and meeting notes. A simple name while we focus on making the app work well.</p>
    <a href="https://murmur-rho-pied.vercel.app">Open Voice Notes</a>
  </main>
</body>
</html>
