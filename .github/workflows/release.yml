name: Release

# Tags build candidates for local signing. Never publish an ad-hoc app as a production
# update. The Apple certificate and Sparkle Ed25519 key stay in the local Keychain.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build a candidate for local signing
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Test the native app, session store and MCP server
        run: make test

      - name: Build the release candidate
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow on a numeric release tag, such as v0.7.0."
            exit 1
          fi
          build=$(date -u +%Y%m%d%H%M%S)
          make app CONFIG=release VERSION="$version" BUILD_NUMBER="$build"
          ditto -c -k --keepParent "$HOME/Library/Caches/MurmurBuild/Murmur.app" "$RUNNER_TEMP/Concourse-candidate.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Concourse-release-candidate
          path: ${{ runner.temp }}/Concourse-candidate.zip
          retention-days: 7
