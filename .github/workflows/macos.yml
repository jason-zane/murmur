name: macOS

# Runs the native tests, including the shared dictionary contract. Microphone and
# on-device model checks remain opt-in and are verified on the installed app.

on:
  push:
    branches: [master, codex/orca-improvements]
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Resources/**', 'Tools/**', 'Package.swift', 'Package.resolved', 'Makefile', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Resources/**', 'Tools/**', 'Package.swift', 'Package.resolved', 'Makefile', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary-contract:
    name: Native tests and dictionary contract
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.2, but the runner defaults to an
      # older Xcode (Swift 6.1) and fails to even parse the manifest. Select the newest
      # Xcode present rather than pinning a version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      # The app test target requires macOS 26. make keeps build products outside the
      # checkout and also checks that the shared dictionary vectors have not drifted.
      - name: Test the native app, session store and MCP server
        run: make test

      # Assembles and (ad-hoc) signs the bundle, so a broken Info.plist or a missing
      # helper executable fails here rather than on the release tag.
      - name: Assemble the app bundle
        run: make app

      - name: Preserve debug candidate for isolated UI preview
        if: github.ref == 'refs/heads/codex/orca-improvements'
        run: ditto -c -k --keepParent "$HOME/Library/Caches/MurmurBuild/Murmur.app" "$RUNNER_TEMP/Concourse-preview.zip"

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/codex/orca-improvements'
        with:
          name: Concourse-debug-preview
          path: ${{ runner.temp }}/Concourse-preview.zip
          retention-days: 7

      - name: Assemble release candidate
        if: github.ref == 'refs/heads/codex/orca-improvements'
        run: make app CONFIG=release VERSION=0.7.0 BUILD_NUMBER=2026101001

      - name: Preserve release candidate for local signing
        if: github.ref == 'refs/heads/codex/orca-improvements'
        run: ditto -c -k --keepParent "$HOME/Library/Caches/MurmurBuild/Murmur.app" "$RUNNER_TEMP/Concourse-candidate.zip"

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/codex/orca-improvements'
        with:
          name: Concourse-release-candidate
          path: ${{ runner.temp }}/Concourse-candidate.zip
          retention-days: 7

      - name: Confirm the vectors on both sides are identical
        run: |
          if ! diff -q shared/dictionary-test-vectors.json Tests/MurmurDictionaryTests/dictionary-test-vectors.json; then
            echo "::error::The Swift test copy of the vectors has drifted from shared/."
            echo "Run: cp shared/dictionary-test-vectors.json Tests/MurmurDictionaryTests/"
            exit 1
          fi
          echo "Vectors match."
